<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Results summary component</title>

</head>
<body>
  <main class="wrapper">
    <div class="container">
      <div class="result-column">
        <p class="title">Your Result</p>

        <div class="result-number">
          <p class="number">76</p>
          <p class="of">of 100</p>
        </div>
        <p class="note">Great</p>
        <p class="comment">You scored higher than 65% of the people who have taken these tests.</p>
      </div>

      <div class="summary-column">
        <p class="title-summ">Summary</p>

        <div class="summary-wrapper">
          <div class="summary-items">
            <p class="summary-category"> <img src="assets/images/icon-reaction.svg" alt="reaction icon"> Reaction</p> <p class="score">80 <span>/ 100</span></p>
          </div>

          <div class="summary-items">
            <p class="summary-category"> <img src="assets/images/icon-memory.svg" alt="memory icon"> Memory</p> <p class="score">92 <span>/ 100</span></p>
          </div>

          <div class="summary-items">
            <p class="summary-category"> <img src="assets/images/icon-verbal.svg" alt="verbal icon"> Verbal</p> <p class="score">61 <span>/ 100</span></p>
          </div>

          <div class="summary-items">
            <p class="summary-category"> <img src="assets/images/icon-visual.svg" alt="visual icon"> Visual</p> <p class="score">72 <span>/ 100</span></p>
          </div>
        </div>

        <button class="btn">Continue</button>
      </div>
    </div>
  </main>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/brenda-magg" target="_blank">Brenda Magg</a>.
  </div>
  

</body>
</html>
